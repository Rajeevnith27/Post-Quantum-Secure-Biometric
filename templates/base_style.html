<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Montserrat:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-color: #4CAF50;
        --secondary-color: #2196F3;
        --accent-color: #FFC107;
        --danger-color: #f44336;
        --pink-color: #E91E63;
        --text-color: #F5F5F7;
        --text-muted: #8E8E93;
        --background-color: #0B0F19;
        --card-background: rgba(17, 24, 39, 0.7);
        --section-background: rgba(31, 41, 55, 0.5);
        --input-background: rgba(17, 24, 39, 0.9);
        --border-color: rgba(255, 255, 255, 0.08);
        --border-focus: #2196F3;
        --shadow-glow: rgba(33, 150, 243, 0.25);
        --gradient-start: #0B0F19;
        --gradient-end: #1F1A3A;
    }
    
    body {
        font-family: 'Roboto', 'Montserrat', sans-serif;
        margin: 0;
        padding: 20px;
        background: radial-gradient(circle at top, var(--gradient-end) 0%, var(--gradient-start) 100%);
        color: var(--text-color);
        line-height: 1.6;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        overflow-x: hidden;
    }
    
    .container {
        background: var(--card-background);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        max-width: 900px;
        width: 100%;
        margin: 20px 0;
        border: 1px solid var(--border-color);
    }
    
    h1, h2, h3 {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    h1 {
        color: #FFFFFF;
        text-align: center;
        margin-bottom: 30px;
        text-shadow: 0 0 15px rgba(33, 150, 243, 0.4);
    }
    
    /* Tabs Layout */
    .tabs-nav {
        display: flex;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 30px;
        gap: 5px;
    }
    .tab-btn {
        padding: 12px 24px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-weight: 600;
        font-family: 'Montserrat', sans-serif;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.3s ease;
        font-size: 0.95em;
    }
    .tab-btn:hover {
        color: #FFFFFF;
    }
    .tab-btn.active {
        color: var(--secondary-color);
        border-bottom-color: var(--secondary-color);
        text-shadow: 0 0 10px rgba(33, 150, 243, 0.3);
    }
    .tab-content {
        display: none;
    }
    .tab-content.active {
        display: block;
        animation: fadeIn 0.4s ease-out;
    }
    
    .section {
        margin-bottom: 30px;
        padding: 24px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background-color: var(--section-background);
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .section:hover {
        box-shadow: 0 6px 24px rgba(33, 150, 243, 0.15);
    }
    .section h3 {
        color: var(--secondary-color);
        margin-top: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 12px;
        margin-bottom: 20px;
    }
    
    /* Messages & Alert Boxes */
    .message-box {
        padding: 16px 20px;
        margin-bottom: 25px;
        border-radius: 10px;
        font-weight: 500;
        border-left: 5px solid transparent;
        animation: fadeIn 0.5s ease-out;
    }
    .success { background-color: rgba(76, 175, 80, 0.15); border-color: var(--primary-color); color: #C8E6C9; }
    .error { background-color: rgba(244, 67, 54, 0.15); border-color: var(--danger-color); color: #FFCDD2; }
    .warning { background-color: rgba(255, 193, 7, 0.15); border-color: var(--accent-color); color: #FFE082; }
    .info { background-color: rgba(33, 150, 243, 0.15); border-color: var(--secondary-color); color: #BBDEFB; }
    
    /* Input Elements */
    input[type="text"], select {
        width: 100%;
        padding: 12px 16px;
        margin: 10px 0;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        font-size: 1em;
        box-sizing: border-box;
        background-color: var(--input-background);
        color: var(--text-color);
        transition: all 0.3s ease;
    }
    input[type="text"]:focus, select:focus {
        border-color: var(--border-focus);
        box-shadow: 0 0 10px var(--shadow-glow);
        outline: none;
    }
    
    /* File input wrap styling */
    .file-input-wrapper {
        border: 2px dashed rgba(255, 255, 255, 0.15);
        padding: 20px;
        text-align: center;
        border-radius: 10px;
        margin: 15px 0;
        background: rgba(0, 0, 0, 0.2);
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .file-input-wrapper:hover {
        border-color: var(--secondary-color);
        background: rgba(33, 150, 243, 0.05);
    }
    .file-input-wrapper input[type="file"] {
        display: none;
    }
    .file-input-label {
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
    }
    .file-input-wrapper:hover .file-input-label {
        color: #FFFFFF;
    }
    
    /* Buttons */
    .btn {
        padding: 14px 28px;
        background: linear-gradient(90deg, var(--secondary-color) 0%, #1976D2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1.05em;
        font-weight: 700;
        font-family: 'Montserrat', sans-serif;
        transition: all 0.3s ease;
        display: inline-block;
        width: 100%;
        box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        box-sizing: border-box;
        text-align: center;
        text-decoration: none;
    }
    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(33, 150, 243, 0.5);
    }
    .btn:active {
        transform: translateY(0);
    }
    .btn-success {
        background: linear-gradient(90deg, var(--primary-color) 0%, #388E3C 100%);
        box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
    }
    .btn-success:hover {
        box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
    }
    .btn-danger {
        background: linear-gradient(90deg, var(--danger-color) 0%, #d32f2f 100%);
        box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
    }
    .btn-danger:hover {
        box-shadow: 0 6px 20px rgba(244, 67, 54, 0.5);
    }
    .btn-warning {
        background: linear-gradient(90deg, var(--accent-color) 0%, #FF9800 100%);
        color: #000;
        box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
    }
    .btn-warning:hover {
        box-shadow: 0 6px 20px rgba(255, 193, 7, 0.5);
        transform: translateY(-2px);
    }
    
    /* Thresholds Panel */
    .thresholds {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        font-size: 0.9em;
        background-color: rgba(0, 0, 0, 0.3);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .thresholds div {
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    /* Biometric Scan Simulator */
    .scanner-panel {
        position: relative;
        height: 180px;
        background: #070913;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 15px 0;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    .scanner-glow {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(33, 150, 243, 0.15) 0%, transparent 70%);
        animation: pulse 2s infinite alternate;
    }
    .scanner-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--secondary-color), transparent);
        box-shadow: 0 0 10px var(--secondary-color);
        animation: scan 2.5s linear infinite;
        display: none;
    }
    .scanner-fingerprint {
        width: 70px;
        height: auto;
        opacity: 0.25;
        transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .scanner-panel.scanning .scanner-fingerprint {
        opacity: 0.85;
        filter: drop-shadow(0 0 8px var(--secondary-color));
    }
    .scanner-panel.scanning .scanner-line {
        display: block;
    }
    .scanner-status-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.85em;
        color: var(--text-muted);
        margin-top: 10px;
        z-index: 5;
    }
    .scanner-panel.scanning .scanner-status-text {
        color: var(--secondary-color);
        text-shadow: 0 0 5px rgba(33, 150, 243, 0.4);
    }
    
    /* Code and Details display */
    .details-list {
        list-style: none;
        padding: 0;
        margin-top: 15px;
        background-color: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        border: 1px solid var(--border-color);
        padding: 20px;
    }
    .details-list li {
        padding: 12px 0;
        border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .details-list li:last-child {
        border-bottom: none;
    }
    .details-list li strong {
        color: var(--secondary-color);
    }
    
    code {
        font-family: 'Fira Code', 'Courier New', monospace;
    }

    /* Logs Table */
    .table-container {
        overflow-x: auto;
        margin-top: 20px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 0.9em;
    }
    th, td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
    }
    th {
        background-color: rgba(0, 0, 0, 0.4);
        color: #FFFFFF;
        font-weight: 600;
        font-family: 'Montserrat', sans-serif;
    }
    tr:last-child td {
        border-bottom: none;
    }
    tr:hover td {
        background-color: rgba(255, 255, 255, 0.02);
    }
    
    /* Progress Bars */
    .progress-bar-container {
        width: 100%;
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 6px;
        margin-top: 8px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.03);
    }
    .progress-bar {
        height: 25px;
        background-color: var(--primary-color);
        width: 0%;
        text-align: center;
        line-height: 25px;
        color: white;
        font-size: 0.85em;
        font-weight: 700;
        transition: width 0.8s ease-in-out;
    }
    .progress-bar.low { background-color: var(--danger-color); }
    .progress-bar.medium { background-color: var(--accent-color); color: #000; }
    .progress-bar.high { background-color: var(--primary-color); }

    /* Action buttons grouping */
    .action-buttons {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
    }
    
    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
        from { transform: scale(0.9); opacity: 0.4; }
        to { transform: scale(1.1); opacity: 0.9; }
    }
    @keyframes scan {
        0% { top: 0%; }
        50% { top: 100%; }
        100% { top: 0%; }
    }
    
    /* Mode Select Tab Buttons */
    .mode-select {
        display: flex;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        margin-bottom: 20px;
        overflow: hidden;
    }
    .mode-btn {
        flex: 1;
        padding: 10px;
        background: rgba(0, 0, 0, 0.3);
        border: none;
        color: var(--text-muted);
        font-family: 'Montserrat', sans-serif;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.85em;
    }
    .mode-btn.active {
        background: var(--secondary-color);
        color: white;
    }
    
    /* Device Select List */
    .device-select-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 10px 0;
    }
    .device-option {
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        text-align: center;
        font-family: 'Montserrat', sans-serif;
        font-size: 0.85em;
        cursor: pointer;
        transition: all 0.2s ease;
        color: var(--text-muted);
    }
    .device-option.selected {
        border-color: var(--secondary-color);
        background: rgba(33, 150, 243, 0.08);
        color: white;
        font-weight: bold;
    }
    
    /* Responsive adjustments */
    @media (max-width: 600px) {
        body { padding: 10px; }
        .container { padding: 20px; }
        h1 { font-size: 1.6em; }
        .tabs-nav { flex-direction: column; gap: 0; }
        .tab-btn { width: 100%; border-bottom: none; border-left: 3px solid transparent; text-align: left; padding: 12px; }
        .tab-btn.active { border-left-color: var(--secondary-color); }
        .action-buttons { grid-template-columns: 1fr; }
        .device-select-panel { grid-template-columns: 1fr; }
    }
    .footer {
        text-align: center;
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 0.85em;
        color: var(--text-muted);
    }
</style>
